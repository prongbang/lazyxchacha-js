[package]
name = "lazyxchacha"
version = "1.0.7"
description = "Lazy XChaCha20-Poly1305 in JavaScript base on RustCrypto: ChaCha20Poly1305."
edition = "2018"
license-file = "LICENSE"
keywords = ["lazyxchacha", "xchacha"]
repository = "https://github.com/prongbang/lazyxchacha-js"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
lazyxchacha = "0.2.0"
faster-hex = "0.9.0"
# Two getrandom majors are in the tree: 0.2 via x25519-dalek's rand_core, and
# 0.4 via chacha20poly1305's crypto-common. Both need their wasm backend turned
# on or `wasm32-unknown-unknown` has no entropy source.
getrandom = { version = "0.2", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

# chacha20 0.10.1 has no wasm SIMD backend, so on wasm32 it runs the scalar
# `soft` path — measured 332 MB/s here while poly1305 does 2.4 GB/s, i.e. the
# cipher is ~87% of AEAD time. The vendored copy adds backends/simd128.rs, a
# lane-for-lane port of the crate's own sse2.rs. Drop this patch when
# RustCrypto ships a simd128 backend upstream.
[patch.crates-io]
chacha20 = { path = "vendor/chacha20" }

[profile.release]
# ChaCha20 and Poly1305 are tight arithmetic loops and this is the only thing
# the crate does, so size-optimising them was a poor trade: `opt-level = "s"`
# measured 204 MB/s in Chrome against 303 MB/s here, and paired with the
# +simd128 the Makefile passes, the wasm comes out *smaller* as well (85,876 vs
# 86,708 bytes) — vectorising costs less code than unrolling scalar rounds.
opt-level = 3
# Fat LTO + one codegen unit lets LLVM inline the whole chacha20/poly1305
# round loop into a single unit before vectorising it.
lto = "fat"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]
